name: pulse
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  android_intent_plus: ^6.1.0
  blurhash_ffi: ^1.2.7
  cached_network_image: ^4.0.4
  camera: ^0.12.1
  clock: ^1.1.3
  connectivity_plus: ^7.3.2
  country_picker: ^2.0.28
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_compress: 2.0.0
  flutter_html: ^3.0.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  gal: ^2.3.3
  geolocator: ^14.0.1
  get_it: ^9.3.0
  # flutter_html 3.0.0 calls html's internal `matches`, which html 0.15.6+ no longer exports; keep below 0.15.6.
  html: '>=0.15.4 <0.15.6'
  http: ^1.6.0
  image_picker: ^1.2.4
  injectable: ^3.0.0
  intl: ^0.20.3
  lottie: ^3.6.1
  permission_handler: ^13.0.2
  pinput: ^6.0.2
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  video_flux: ^0.0.1
  video_player: ^2.14.1
  video_thumbnail: ^0.5.6

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  generate: true # gen-l10n: lib/l10n/*.arb -> AppLocalizations (see l10n.yaml)

  assets:
    - assets/icons/
    - assets/animations/
    - assets/images/onboarding/en/
    - assets/images/onboarding/ar/

  # Fonts (docs/specs/_theme/typography.md): Sora for headings, Noto Sans for everything
  # else, Noto Sans Arabic for Arabic (see AppTextStyles).
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
